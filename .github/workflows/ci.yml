name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # For tests/unit/test_parity.py: the calculator whose rules the published values follow.
      - uses: actions/checkout@v7
        with:
          repository: Abrunacci/cuanto-cuesta
          path: cuanto-cuesta
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run pytest
        env:
          CUANTO_CUESTA_DIR: ${{ github.workspace }}/cuanto-cuesta
      - run: uv run mypy
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build --tag data-pipeline:ci .
