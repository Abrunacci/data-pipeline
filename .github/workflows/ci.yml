name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a change in cuanto-cuesta that breaks the parity tests shows up even when
  # nothing changes here: they check against its main branch.
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The same step every repository of the owner runs; the policy lives in infra
      # (.github/actions/check-commit-metadata/README.md). It reads the PR's commits with the job's
      # token, needs no checkout, and passes on pushes and the weekly run, where there is no PR.
      - name: Check commit metadata
        uses: Abrunacci/infra/.github/actions/check-commit-metadata@1306bea3c9d3c518394cc9ea249d7b3753a7a381  # main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # For tests/unit/test_parity.py: the calculator whose rules the published values follow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Abrunacci/cuanto-cuesta
          path: cuanto-cuesta
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run pytest
        env:
          CUANTO_CUESTA_DIR: ${{ github.workspace }}/cuanto-cuesta
      - run: uv run mypy
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  image:
    # The weekly run is for the parity tests only.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag data-pipeline:ci .
      # Run it the way the server does (read-only, its uid, no capabilities, no network): the
      # runner's configuration loads with no database, and so does the API's, until step 3 of
      # docs/plan.md removes it. Neither connects to anything.
      - run: >-
          docker run --rm --network none --read-only --tmpfs /tmp --user 10005:10005
          --cap-drop ALL --security-opt no-new-privileges data-pipeline:ci
          python -m data_pipeline.runner --check
      - run: >-
          docker run --rm --network none --read-only --tmpfs /tmp --user 10005:10005
          --cap-drop ALL --security-opt no-new-privileges
          --env DATABASE_URL=postgresql+psycopg://unused@localhost/unused data-pipeline:ci
          sh -c 'alembic history && python -c "from data_pipeline.api.main import app; app()"'
      # The image's own command, as the server starts it. With no network its sources fail and
      # say so in the log, but it stays up and Docker reports it healthy: what a deploy waits for.
      - run: |
          docker run --detach --name runner --network none --read-only --tmpfs /tmp \
            --user 10005:10005 --cap-drop ALL --security-opt no-new-privileges data-pipeline:ci
          for _ in $(seq 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' runner)"
            if [[ "$status" == healthy ]]; then break; fi
            sleep 2
          done
          docker logs runner
          docker rm --force runner
          [[ "$status" == healthy ]]
      # The HEALTHCHECK command in the same conditions: it fails without the heartbeat file and
      # passes once the file is there.
      - run: >-
          docker run --rm --network none --read-only --tmpfs /tmp --user 10005:10005
          --cap-drop ALL --security-opt no-new-privileges data-pipeline:ci
          sh -c '! python -m data_pipeline.runner.heartbeat && touch /tmp/alive
          && python -m data_pipeline.runner.heartbeat'

  # What lands on main is published and deployed; pull requests and the weekly run never are.
  publish:
    needs: [check, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that writes: the image to GHCR, with the job's own token.
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The tag is the commit; the server deploys by digest, so a tag moved later changes nothing.
      # The source label links the package to this repository.
      - name: Build and push
        id: push
        env:
          IMAGE: ghcr.io/abrunacci/data-pipeline
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build --tag "$IMAGE:$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")"
          digest="${digest#*@}"
          docker logout ghcr.io
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::unexpected image digest: '$digest'"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # The server pulls the image by digest and switches to it only if its HEALTHCHECK turns healthy;
  # otherwise it puts back the previous release (infra: ansible/README.md, "Deploying a backend").
  deploy:
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Its secrets and variables exist only in this environment, which only main can use.
    environment: production
    permissions: {}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # The host, port and user come from the environment's variables, never from this file: the
      # repository is public. The key can only run deploy-backend for this project.
      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          for name in DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DIGEST; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is empty: set it in the production environment"
              exit 1
            fi
          done
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # StrictHostKeyChecking: only the server in DEPLOY_KNOWN_HOSTS is trusted. On a port
          # other than 22, its line must be written as [host]:port (ssh-keyscan -p does that).
          ssh -i ~/.ssh/deploy -p "$DEPLOY_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o BatchMode=yes -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" \
            deploy-backend "$GITHUB_SHA" "$DIGEST" "$GITHUB_RUN_ID" </dev/null
