# Local development: Postgres, the migrations and the app. `docker compose up --build`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: pipeline
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pipeline"]
      interval: 2s
      retries: 15

  migrate:
    image: data-pipeline:local
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://pipeline:pipeline@db/pipeline
    depends_on:
      db:
        condition: service_healthy

  app:
    image: data-pipeline:local
    environment:
      DATABASE_URL: postgresql+psycopg://pipeline:pipeline@db/pipeline
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db:
