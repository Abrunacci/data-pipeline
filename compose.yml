# Local development: `docker compose up --build` runs what the server runs, from a read-only
# container with the server's uid and 256 MB of memory. With CUANTO_CUESTA_INGEST_URL and
# CUANTO_CUESTA_INGEST_TOKEN set it posts each accepted value there; here it only logs them.
services:
  runner:
    image: data-pipeline:local
    build: .
    user: "10005:10005"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    memswap_limit: 256m
