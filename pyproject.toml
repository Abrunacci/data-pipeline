[project]
name = "data-pipeline"
version = "0.1.0"
description = "A runner that reads and checks data on a schedule and sends it to the apps that use it"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    # Time zones for zoneinfo where the OS has none (dev on Windows). The image's Debian base
    # has its own, which zoneinfo uses first.
    "tzdata>=2026.4",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# CI checks out the calculator here for the parity tests.
extend-exclude = ["cuanto-cuesta"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "RET", "TID", "ASYNC", "DTZ"]

[tool.mypy]
strict = true
enable_error_code = ["exhaustive-match"]
plugins = ["pydantic.mypy"]
python_version = "3.13"
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
